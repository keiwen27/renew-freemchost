name: Debug Renew Diag

on:
  workflow_dispatch: # 仅手动触发：跳过随机延迟，快速诊断 renew.py 当前失败原因

jobs:
  diag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run renew script (diagnostic, no delay)
      env:
        MY_EMAIL: ${{ secrets.MY_EMAIL }}
        MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        ANON_KEY: ${{ secrets.ANON_KEY }}
        SERVER_ID: ${{ secrets.SERVER_ID }}
      run: |
        set -o pipefail
        python renew.py | tee renew.log

    # 手动诊断也推送 TG：便于在手机上远程确认诊断结果（TG_ID 支持逗号分隔多 chat_id）
    - name: Send Telegram Notification
      if: always()
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}
      run: |
        # 1. 依据 renew.log 内容判定真实结果，设置对应标题
        if grep -q "未到续期窗口" renew.log; then
          TITLE="⏭️ Freemchost 服务器仍在有效期，本次跳过续期 (诊断)"
        elif [ "${{ job.status }}" = "success" ]; then
          TITLE="✅ Freemchost 诊断运行：自动续期成功！"
        else
          TITLE="❌ Freemchost 诊断运行：自动续期失败！"
        fi

        # 2. 从 renew.log 中提取 TG_SUMMARY 标记块作为状态摘要
        INFO_SUMMARY=$(sed -n '/TG_SUMMARY_START/,/TG_SUMMARY_END/p' renew.log | grep -v "TG_SUMMARY" | sed -E 's/^\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]{8}\] //; s/"//g')

        # 3. 日志缺块时抓取最后 5 行兜底
        if [ -z "$INFO_SUMMARY" ]; then
          INFO_SUMMARY=$(tail -n 5 renew.log | sed 's/"//g')
        fi

        MSG_TEXT="${TITLE}

        📊 服务器最新状态:
        ${INFO_SUMMARY}"

        if [ -z "$TG_TOKEN" ] || [ -z "$TG_ID" ]; then
          echo "⚠️ 未检测到 Secrets TG_TOKEN / TG_ID，跳过 TG 推送。"
          exit 0
        fi

        ANY_OK=0
        IFS=','
        for CHAT in $TG_ID; do
          CHAT=$(printf '%s' "$CHAT" | tr -d '[:space:]')
          [ -z "$CHAT" ] && continue
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=${MSG_TEXT}")
          echo "Telegram API 响应 (chat ${CHAT}): ${RESPONSE}"
          case "$RESPONSE" in
            *'"ok":true'*) echo "✅ TG 推送成功 -> ${CHAT}"; ANY_OK=1;;
            *) echo "❌ TG 推送失败 -> ${CHAT}：请检查该 chat_id 是否正确，且该账号已向机器人发送过 /start";;
          esac
        done
        unset IFS
        [ "$ANY_OK" = "1" ] || echo "⚠️ 所有 chat_id 均推送失败，请检查 Secrets TG_TOKEN / TG_ID"
